AWSTemplateFormatVersion: 2010-09-09
# Metadata: [TODO]
#   AWS::CloudFormation::Interface:
#     ParameterGroups:
#       -
#         Label:
#           default: Global
#         Parameters:
#           - AllowIP
#           - SplunkDeploy
#       -
#         Label:
#           default: If you set the Splunkdeploy parameter to true, the following parameters are required
#         Parameters:
#           - PortforSplunk
#           - PasswordforSplunk

#   Project
#   Environment
#   EC2VPCCidrBlock
#   SubnetCidrBits
#   NetworkRedundancy
#   NetworkLayer

Parameters:
  Project:
    Description: ''
    Type: 'String'
    Default: 'my-sample-network'
  Environment:
    Description: ''
    Type: 'String'
    Default: 'stg'
    AllowedValues:
      - 'dev'
      - 'prod'
      - 'stg'
  EC2VPCCidrBlock:
    Description: ''
    Type: 'String'
    Default: '10.0.0.0/16'
  SubnetCidrBits:
    Description: ''
    Type: 'Number'
    Default: 8
    MaxValue: 16
    MinValue: 0
  NetworkRedundancy:
    Description: ''
    Type: 'String'
    Default: 'multi-az-3'
    AllowedValues:
      - 'multi-az-2'
      - 'multi-az-3'
  NetworkLayer:
    Description: ''
    Type: 'String'
    Default: 'public-private'
    AllowedValues:
      - 'public-private'
      - 'public-application-database'

Conditions:
  ThreeTier: !Equals [!Ref NetworkLayer, 'public-application-database']
  ThreeAZ:  !Equals [!Ref NetworkRedundancy, 'multi-az-3']
  FullSize: !And
    - !Equals [!Ref NetworkLayer, 'public-application-database']
    - !Equals [!Ref NetworkRedundancy, 'multi-az-3']

Resources:
  EC2VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref EC2VPCCidrBlock
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: 'default'
      # Ipv4IpamPoolId: String
      # Ipv4NetmaskLength: Integer
      Tags:
        - Key: 'Name'
          Value: !Sub '${Project}-${Environment}-vpc'
        - Key: 'project'
          Value: !Ref Project
        - Key: 'environment'
          Value: !Ref Environment

  EC2InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: 'Name'
          Value: !Sub '${Project}-${Environment}-igw'
        - Key: 'project'
          Value: !Ref Project
        - Key: 'environment'
          Value: !Ref Environment

  EC2VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      InternetGatewayId: !Ref EC2InternetGateway
      VpcId: !Ref EC2VPC

  EC2VPCDHCPOptionsAssociation:
    Type: 'AWS::EC2::VPCDHCPOptionsAssociation'
    Properties:
      DhcpOptionsId: !Ref EC2DHCPOptions
      VpcId: !Ref EC2VPC

  EC2DHCPOptions:
    Type: 'AWS::EC2::DHCPOptions'
    Properties:
      DomainName: !Sub '${AWS::Region}.compute.internal'
      DomainNameServers:
        - 'AmazonProvidedDNS'
      Tags:
        - Key: 'Name'
          Value: !Sub '${Project}-${Environment}-dopt'
        - Key: 'project'
          Value: !Ref Project
        - Key: 'environment'
          Value: !Ref Environment
  
  Fn::ForEach::AZs:
    - Index
    - - 1
      - 2
      - 3
    - EC2SubnetPublicAZ{$INDEX}:
        Type: 'AWS::EC2::Subnet'
        Properties:
          AvailabilityZone: !Select [0, !GetAZs '']
          CidrBlock: !Select [0, !Cidr [ !Ref EC2VPCCidrBlock, 9, !Ref SubnetCidrBits ]]
          MapPublicIpOnLaunch: true
          Tags:
            - Key: 'Name'
              Value: !Sub '${Project}-${Environment}-public-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
          VpcId: !Ref EC2VPC
    
      EC2RouteTablePublicAZ{$INDEX}:
        Type: 'AWS::EC2::RouteTable'
        Properties:
          Tags:
            - Key: 'Name'
              Value: !Sub '${Project}-${Environment}-public-rt-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
          VpcId: !Ref EC2VPC
    
      EC2SubnetRouteTableAssociationPublicAZ{$INDEX}:
        Type: 'AWS::EC2::SubnetRouteTableAssociation'
        Properties:
          RouteTableId: !Ref EC2RouteTablePublicAZ{$INDEX}
          SubnetId: !Ref EC2SubnetPublicAZ{$INDEX}
    
      EC2RouteIPv4PublicAZ{$INDEX}:
        DependsOn: EC2VPCGatewayAttachment
        Type: 'AWS::EC2::Route'
        Properties:
          DestinationCidrBlock: '0.0.0.0/0'
          GatewayId: !Ref EC2InternetGateway
          RouteTableId: !Ref EC2RouteTablePublicAZ{$INDEX}
    
      EC2SubnetPrivate1AZ{$INDEX}:
        Type: 'AWS::EC2::Subnet'
        Properties:
          AvailabilityZone: !Select [0, !GetAZs '']
          CidrBlock: !Select [1, !Cidr [ !Ref EC2VPCCidrBlock, 9, !Ref SubnetCidrBits ]]
          MapPublicIpOnLaunch: false
          Tags:
            - Key: 'Name'
              Value: !If
                - ThreeTier
                - !Sub '${Project}-${Environment}-private-application-az{$index}'
                - !Sub '${Project}-${Environment}-private-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
          VpcId: !Ref EC2VPC
    
      EC2RouteTablePrivate1AZ{$INDEX}:
        Type: 'AWS::EC2::RouteTable'
        Properties:
          Tags:
            - Key: 'Name'
              Value: !If
                - ThreeTier
                - !Sub '${Project}-${Environment}-rt-private-application-az{$index}'
                - !Sub '${Project}-${Environment}-rt-private-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
          VpcId: !Ref EC2VPC
    
      EC2SubnetRouteTableAssociationPrivate1AZ{$INDEX}:
        Type: 'AWS::EC2::SubnetRouteTableAssociation'
        Properties:
          RouteTableId: !Ref EC2RouteTablePrivate1AZ{$INDEX}
          SubnetId: !Ref EC2SubnetPrivate1AZ{$INDEX}
    
      EC2RouteIPv4Private1AZ{$INDEX}:
        Type: 'AWS::EC2::Route'
        Properties:
          DestinationCidrBlock: '0.0.0.0/0'
          NatGatewayId: !Ref EC2NatGatewayAZ{$INDEX}
          RouteTableId: !Ref EC2RouteTablePrivate1AZ{$INDEX}
    
      EC2EIPNatGatewayAZ{$INDEX}:
        Type: 'AWS::EC2::EIP'
        DependsOn: EC2VPCGatewayAttachment
        Properties:
          Domain: 'vpc'
          Tags:
            - Key: 'Name'
              Value: !Sub '${Project}-${Environment}-eip-nat-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
    
      EC2NatGatewayAZ{$INDEX}:
        Type: 'AWS::EC2::NatGateway'
        Properties:
          AllocationId: !GetAtt EC2EIPNatGatewayAZ{$INDEX}.AllocationId
          SubnetId: !Ref EC2SubnetPublicAZ{$INDEX}
          Tags:
            - Key: 'Name'
              Value: !Sub '${Project}-${Environment}-nat-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
    
      EC2SubnetPrivate2AZ{$INDEX}:
        Condition: ThreeTier
        Type: 'AWS::EC2::Subnet'
        Properties:
          AvailabilityZone: !Select [0, !GetAZs '']
          CidrBlock: !Select [2, !Cidr [ !Ref EC2VPCCidrBlock, 9, !Ref SubnetCidrBits ]]
          MapPublicIpOnLaunch: false
          Tags:
            - Key: 'Name'
              Value: !Sub '${Project}-${Environment}-private-database-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
          VpcId: !Ref EC2VPC
    
      EC2RouteTablePrivate2AZ{$INDEX}:
        Condition: ThreeTier
        Type: 'AWS::EC2::RouteTable'
        Properties:
          Tags:
            - Key: 'Name'
              Value: !Sub '${Project}-${Environment}-rt-private-database-az{$index}'
            - Key: 'project'
              Value: !Ref Project
            - Key: 'environment'
              Value: !Ref Environment
          VpcId: !Ref EC2VPC
    
      EC2SubnetRouteTableAssociationPrivate2AZ{$INDEX}:
        Condition: ThreeTier
        Type: 'AWS::EC2::SubnetRouteTableAssociation'
        Properties:
          RouteTableId: !Ref EC2RouteTablePrivate2AZ{$INDEX}
          SubnetId: !Ref EC2SubnetPrivate2AZ{$INDEX}
    
