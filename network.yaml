AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  Project:
    Description: ""
    Type: String
    Default: my-sample-network

  Environment:
    Description: ""
    Type: String
    AllowedValues:
      - dev
      - prod
      - stg
    Default: stg

  EC2VPCCidrBlock:
    Description: ""
    Type: String
    Default: 10.0.0.0/16

  SubnetCidrBits:
    Description: ""
    Type: Number
    Default: 8
    MaxValue: 16
    MinValue: 0

  NetworkRedundancy:
    Description: ""
    Type: String
    AllowedValues:
      - multi-az-2
      - multi-az-3
    Default: multi-az-3

  NetworkLayer:
    Description: ""
    Type: String
    AllowedValues:
      - public-private
      - public-application-database
    Default: public-private

  AZIDs:
    Description: ""
    Type: CommaDelimitedList

Mappings:
  AZIndexMap:
    "1":
      First: 0
    "2":
      First: 1
    "3":
      First: 2

  SubnetIndexMap:
    "1":
      First: 0
      Second: 1
      Third: 2
    "2":
      First: 3
      Second: 4
      Third: 5
    "3":
      First: 6
      Second: 7
      Third: 8

Conditions:
  ThreeTier: !Equals
    - !Ref NetworkLayer
    - public-application-database

  ThreeAZ: !Equals
    - !Ref NetworkRedundancy
    - multi-az-3

Transform: AWS::LanguageExtensions

Resources:
  EC2VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref EC2VPCCidrBlock
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default

      # Ipv4IpamPoolId: String
      # Ipv4NetmaskLength: Integer
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-vpc

  EC2InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-igw

  EC2VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref EC2InternetGateway
      VpcId: !Ref EC2VPC

  EC2VPCDHCPOptionsAssociation:
    Type: AWS::EC2::VPCDHCPOptionsAssociation
    Properties:
      DhcpOptionsId: !Ref EC2DHCPOptions
      VpcId: !Ref EC2VPC

  EC2DHCPOptions:
    Type: AWS::EC2::DHCPOptions
    Properties:
      DomainName: !Sub ${AWS::Region}.compute.internal
      DomainNameServers:
        - AmazonProvidedDNS
      Tags:
        - Key: Name
          Value: !Sub ${Project}-${Environment}-dopt

  Fn::ForEach::AZs:
    - AZIndex
    - !If
      - ThreeAZ
      - - "1"
        - "2"
        - "3"
      - - "1"
        - "2"
    - EC2SubnetPublicAZ${AZIndex}:
        Type: AWS::EC2::Subnet
        Properties:
          AvailabilityZoneId: !Select
            - Fn::FindInMap:
                - AZIndexMap
                - !Sub ${AZIndex}
                - First
            - !Ref AZIDs
          CidrBlock: !Select
            - Fn::FindInMap:
                - SubnetIndexMap
                - !Sub ${AZIndex}
                - First
            - !Cidr
              - !Ref EC2VPCCidrBlock
              - 9
              - !Ref SubnetCidrBits
          MapPublicIpOnLaunch: true
          Tags:
            - Key: Name
              Value: !Sub ${Project}-${Environment}-public-az${AZIndex}
          VpcId: !Ref EC2VPC
      EC2RouteTablePublicAZ${AZIndex}:
        Type: AWS::EC2::RouteTable
        Properties:
          Tags:
            - Key: Name
              Value: !Sub ${Project}-${Environment}-public-rt-az${AZIndex}
          VpcId: !Ref EC2VPC
      EC2SubnetRouteTableAssociationPublicAZ${AZIndex}:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
          RouteTableId: !Ref
            Fn::Sub: EC2RouteTablePublicAZ${AZIndex}
          SubnetId: !Ref
            Fn::Sub: EC2SubnetPublicAZ${AZIndex}
      EC2RouteIPv4PublicAZ${AZIndex}:
        DependsOn: EC2VPCGatewayAttachment
        Type: AWS::EC2::Route
        Properties:
          DestinationCidrBlock: 0.0.0.0/0
          GatewayId: !Ref EC2InternetGateway
          RouteTableId: !Ref
            Fn::Sub: EC2RouteTablePublicAZ${AZIndex}
      EC2SubnetPrivate1AZ${AZIndex}:
        Type: AWS::EC2::Subnet
        Properties:
          AvailabilityZoneId: !Select
            - Fn::FindInMap:
                - AZIndexMap
                - !Sub ${AZIndex}
                - First
            - !Ref AZIDs
          CidrBlock: !Select
            - Fn::FindInMap:
                - SubnetIndexMap
                - !Sub ${AZIndex}
                - Second
            - !Cidr
              - !Ref EC2VPCCidrBlock
              - 9
              - !Ref SubnetCidrBits
          MapPublicIpOnLaunch: false
          Tags:
            - Key: Name
              Value: !If
                - ThreeTier
                - !Sub ${Project}-${Environment}-private-application-az${AZIndex}
                - !Sub ${Project}-${Environment}-private-az${AZIndex}
          VpcId: !Ref EC2VPC
      EC2RouteTablePrivate1AZ${AZIndex}:
        Type: AWS::EC2::RouteTable
        Properties:
          Tags:
            - Key: Name
              Value: !If
                - ThreeTier
                - !Sub ${Project}-${Environment}-rt-private-application-az${AZIndex}
                - !Sub ${Project}-${Environment}-rt-private-az${AZIndex}
          VpcId: !Ref EC2VPC
      EC2SubnetRouteTableAssociationPrivate1AZ${AZIndex}:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
          RouteTableId: !Ref
            Fn::Sub: EC2RouteTablePrivate1AZ${AZIndex}
          SubnetId: !Ref
            Fn::Sub: EC2SubnetPrivate1AZ${AZIndex}
      EC2RouteIPv4Private1AZ${AZIndex}:
        Type: AWS::EC2::Route
        Properties:
          DestinationCidrBlock: 0.0.0.0/0
          NatGatewayId: !Ref
            Fn::Sub: EC2NatGatewayAZ${AZIndex}
          RouteTableId: !Ref
            Fn::Sub: EC2RouteTablePrivate1AZ${AZIndex}
      EC2EIPNatGatewayAZ${AZIndex}:
        Type: AWS::EC2::EIP
        DependsOn: EC2VPCGatewayAttachment
        Properties:
          Domain: vpc
          Tags:
            - Key: Name
              Value: !Sub ${Project}-${Environment}-eip-nat-az${AZIndex}
      EC2NatGatewayAZ${AZIndex}:
        Type: AWS::EC2::NatGateway
        Properties:
          AllocationId: !GetAtt
            - !Sub EC2EIPNatGatewayAZ${AZIndex}
            - AllocationId
          SubnetId:
            Ref:
              !Sub EC2SubnetPublicAZ${AZIndex}
          Tags:
            - Key: Name
              Value: !Sub ${Project}-${Environment}-nat-az${AZIndex}
      EC2SubnetPrivate2AZ${AZIndex}:
        Type: AWS::EC2::Subnet
        Condition: ThreeTier
        Properties:
          AvailabilityZoneId: !Select
            - Fn::FindInMap:
                - AZIndexMap
                - !Sub ${AZIndex}
                - First
            - !Ref AZIDs
          CidrBlock: !Select
            - Fn::FindInMap:
                - SubnetIndexMap
                - !Sub ${AZIndex}
                - Third
            - !Cidr
              - !Ref EC2VPCCidrBlock
              - 9
              - !Ref SubnetCidrBits
          MapPublicIpOnLaunch: false
          Tags:
            - Key: Name
              Value: !Sub ${Project}-${Environment}-private-database-az${AZIndex}
          VpcId: !Ref EC2VPC
      EC2RouteTablePrivate2AZ${AZIndex}:
        Type: AWS::EC2::RouteTable
        Condition: ThreeTier
        Properties:
          Tags:
            - Key: Name
              Value: !Sub ${Project}-${Environment}-rt-private-database-az${AZIndex}
          VpcId: !Ref EC2VPC
      EC2SubnetRouteTableAssociationPrivate2AZ${AZIndex}:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Condition: ThreeTier
        Properties:
          RouteTableId: !Ref
            Fn::Sub: EC2RouteTablePrivate2AZ${AZIndex}
          SubnetId: !Ref
            Fn::Sub: EC2SubnetPrivate2AZ${AZIndex}
